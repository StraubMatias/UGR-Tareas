name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # El build no conecta a Turso; evita fallos si algún módulo lee env al compilar.
          SESSION_SECRET: ci-placeholder-secret-min-32-chars-long
          TURSO_DATABASE_URL: libsql://ci-placeholder.turso.io
          TURSO_AUTH_TOKEN: ci-placeholder-token
